
# What is the goal of your workflow?
# Goal: Whenever someone changes Python code,
# the linter checks syntax, formatting, and indentation.

name: Auto Linter

on:
  push:
    paths:
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # This step automatically clones the code
      # of the current branch into the runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v4

      # This step installs the linting tool
      - name: Install Linter
        run: pip install ruff
