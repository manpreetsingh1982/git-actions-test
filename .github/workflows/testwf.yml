
# Workflow [No indentation required for naming the workflow]
name: testwf

# On tells when the workflow should run
on:
  push:
    branches:
      - develop
  workflow_dispatch:
# Job tells what the workflow should do
# There can be one or more jobs
jobs:
  # 1st Job
  say-hello:
    # Creates an ephemeral container with Ubuntu running
    runs-on: ubuntu-latest

    # The container will have steps to execute
    steps:
      - name: Say hello to everyone
        run: echo "Hello Dosto"
